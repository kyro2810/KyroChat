<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KyroChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0b141a;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    background:#202c33;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #2f3b43;
}

header h2{
    margin-bottom:5px;
}

#info{
    font-size:12px;
    opacity:0.8;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.msg{
    max-width:75%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    word-wrap:break-word;
}

.me{
    background:#005c4b;
    align-self:flex-end;
}

.other{
    background:#202c33;
    align-self:flex-start;
}

.sender{
    font-size:11px;
    opacity:0.7;
    margin-bottom:5px;
}

#bottom{
    display:flex;
    gap:5px;
    padding:10px;
    background:#202c33;
}

input{
    border:none;
    border-radius:8px;
    padding:10px;
    background:#2a3942;
    color:white;
}

#target{
    width:35%;
}

#message{
    flex:1;
}

button{
    border:none;
    background:#00a884;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
#friends{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:10px;
    background:#111b21;
    border-bottom:1px solid #2f3b43;
}

.friend{
    background:#202c33;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
}

.friend:hover{
    background:#2a3942;
}
</style>
</head>

<body>

<header>
    <h2>KyroChat</h2>
    <div id="info"></div>
</header>

<div id="friends"></div>

<div id="chat"></div>

<div id="bottom">
    <input id="target" placeholder="Friend ID">
    <input id="message" placeholder="Type message...">
    <button onclick="sendMsg()">Send</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDBzZ97kqHW9gcCW_ObNvpCNlW1VTGiDxs",
  authDomain: "kyrochat.firebaseapp.com",
  databaseURL: "https://kyrochat-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "kyrochat",
  storageBucket: "kyrochat.firebasestorage.app",
  messagingSenderId: "360761453559",
  appId: "1:360761453559:web:2138c9c2e83512ace85cf2",
  measurementId: "G-R2G6R4NM8Q"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// =======================
// Permanent ID
// =======================

let myID = localStorage.getItem("kyro_id");

if(!myID){
    myID = "ID-" + Math.random().toString(36).substring(2,10);
    localStorage.setItem("kyro_id", myID);
}


// =======================
// Username
// =======================

let username = localStorage.getItem("kyro_name");

if(!username){
    username = prompt("Enter username:");
    localStorage.setItem("kyro_name", username);
}


// =======================
// UI
// =======================

document.getElementById("info").innerHTML =
`
${username}<br>
${myID}
`;

const chat = document.getElementById("chat");


// =======================
// Add Message
// =======================

function addMessage(type, sender, text){

    const div = document.createElement("div");

    div.className = "msg " + type;

    div.innerHTML = `
        <div class="sender">${sender}</div>
        <div>${text}</div>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


// =======================
// Send Message
// =======================

function sendMsg(){

    const target = document.getElementById("target").value.trim();

    const text = document.getElementById("message").value.trim();

    if(!target || !text) return;

    db.ref("messages/" + target).push({
        sender: username,
        senderID: myID,
        text: text,
        time: Date.now()
    });

    addMessage("me", "You", text);

    document.getElementById("message").value = "";
}


// =======================
// Receive Messages
// =======================

db.ref("messages/" + myID).on("child_added", snapshot => {

    const data = snapshot.val();

    addMessage(
        "other",
        data.sender + " (" + data.senderID + ")",
        data.text
    );

    // delete after reading
    snapshot.ref.remove();
});

</script>

</body>
</html>
