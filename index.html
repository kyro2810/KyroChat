<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KyroChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>

html{
scroll-behavior:smooth;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0b141a;
color:white;
height:100dvh;
overflow:hidden;
display:flex;
flex-direction:column;
}

/* HEADER */

header{
height:60px;
background:#111b21;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

#leftHeader{
display:flex;
align-items:center;
gap:12px;
}

#menuBtn,
#infoBtn{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

#chatTitle{
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-300px;
top:0;
width:280px;
height:100%;
background:#111b21;
transition:0.25s;
z-index:100;
border-right:1px solid rgba(255,255,255,0.1);
overflow-y:auto;
}

#sidebar.open{
left:0;
}

#sidebarHeader{
padding:18px;
font-size:22px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.sideBtn{
width:100%;
padding:14px;
background:#1b2730;
border:none;
color:white;
text-align:left;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.sideBtn:hover{
background:#23323c;
}

.contact{
padding:15px;
border-bottom:1px solid rgba(255,255,255,0.08);
cursor:pointer;
transition:0.2s;
}

.contact:hover{
background:#23323c;
}

/* OVERLAY */

#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
display:none;
z-index:90;
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
background:
linear-gradient(
180deg,
#0b141a,
#101d24
);
}

/* MESSAGE */

.msg{
max-width:80%;
padding:10px 12px;
border-radius:18px;
word-wrap:break-word;
border:1px solid rgba(255,255,255,0.08);
animation:fade 0.2s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.me{
align-self:flex-end;
background:#005c4b;
}

.other{
align-self:flex-start;
background:#1f2c34;
}

.sender{
font-size:11px;
opacity:0.7;
margin-bottom:5px;
}

/* REPLY */

.replyBox{
background:rgba(255,255,255,0.05);
padding:6px;
border-left:3px solid #00a884;
border-radius:8px;
margin-bottom:6px;
font-size:12px;
}

#replyPreview{
display:none;
padding:8px 12px;
background:#162028;
border-top:1px solid rgba(255,255,255,0.1);
}

#replyTop{
color:#00a884;
font-size:13px;
margin-bottom:4px;
}

/* BOTTOM */

#bottom{
padding:10px;
display:flex;
gap:8px;
background:#111b21;
border-top:1px solid rgba(255,255,255,0.1);
}

#message{
flex:1;
background:#1f2c34;
border:1px solid rgba(255,255,255,0.1);
outline:none;
color:white;
padding:12px;
border-radius:15px;
font-size:15px;
}

#sendBtn{
background:#00a884;
border:none;
padding:12px 18px;
color:white;
border-radius:15px;
font-weight:bold;
cursor:pointer;
}

/* POPUP */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:420px;
background:#111b21;
border:1px solid rgba(255,255,255,0.1);
border-radius:18px;
padding:20px;
display:none;
z-index:200;
}

.popupTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.closeBtn{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

.popup button{
margin-top:12px;
width:100%;
padding:12px;
background:#00a884;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

.msg{
max-width:88%;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div id="leftHeader">

<button id="menuBtn">
☰
</button>

<div id="chatTitle">
KyroChat
</div>

</div>

<button id="infoBtn">
ⓘ
</button>

</header>

<!-- SIDEBAR -->

<div id="sidebar">

<div id="sidebarHeader">
KyroChat
</div>

<button class="sideBtn" onclick="addContact()">
➕ Add Contact
</button>

<button class="sideBtn" onclick="createGroup()">
👥 Create Group
</button>

<div id="contactList"></div>

</div>

<!-- OVERLAY -->

<div id="overlay"></div>

<!-- CHAT -->

<div id="chat">

<div style="text-align:center;opacity:0.7;margin-top:50px;line-height:1.8;">

<h2>KyroChat</h2>

<br>

<div id="myProfile"></div>

</div>

</div>

<!-- REPLY -->

<div id="replyPreview">

<div id="replyTop"></div>

<div id="replyText"></div>

</div>

<!-- BOTTOM -->

<div id="bottom">

<input
id="message"
placeholder="Enter message..."
autocomplete="off"
>

<button id="sendBtn">
Send
</button>

</div>

<!-- INFO POPUP -->

<div class="popup" id="infoPopup">

<div class="popupTop">

<h3>Info</h3>

<button
class="closeBtn"
onclick="closePopup('infoPopup')">
✕
</button>

</div>

<p>
1. Give your ID to the person you want to talk to.
Use Add Contact in the ☰ menu.
</p>

<br>

<p>
2. This website is still in development.
</p>

<br>

<p>
Made by Armaan Ayan.
</p>

<button onclick="openLocked()">
Locked Section
</button>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDBzZ97kqHW9gcCW_ObNvpCNlW1VTGiDxs",

authDomain: "kyrochat.firebaseapp.com",

databaseURL:
"https://kyrochat-default-rtdb.asia-southeast1.firebasedatabase.app/",

projectId: "kyrochat",

storageBucket:
"kyrochat.firebasestorage.app",

messagingSenderId:
"360761453559",

appId:
"1:360761453559:web:2138c9c2e83512ace85cf2"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* USER */

let myID =
localStorage.getItem("kyro_id");

if(!myID){

myID =
"ID-" +
Math.random()
.toString(36)
.substring(2,10);

localStorage.setItem(
"kyro_id",
myID
);
}

let username =
localStorage.getItem("kyro_name");

if(!username){

username =
prompt("Enter username:");

localStorage.setItem(
"kyro_name",
username
);
}

document.getElementById(
"myProfile"
).innerHTML = `
${username}
<br>
${myID}
`;

/* DATA */

let contacts =
JSON.parse(
localStorage.getItem(
"kyro_contacts"
)
) || [];

let groups =
JSON.parse(
localStorage.getItem(
"kyro_groups"
)
) || [];

let currentChat = null;
let currentType = "dm";
let replyData = null;

/* ELEMENTS */

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");

const contactList =
document.getElementById("contactList");

const chat =
document.getElementById("chat");

const messageInput =
document.getElementById("message");

const chatTitle =
document.getElementById("chatTitle");

/* SIDEBAR */

document
.getElementById("menuBtn")
.onclick = () => {

sidebar.classList.add("open");

overlay.style.display = "block";
};

overlay.onclick = () => {

sidebar.classList.remove("open");

overlay.style.display = "none";

closePopup("infoPopup");
};

/* POPUP */

function openPopup(id){

document
.getElementById(id)
.style.display = "block";

overlay.style.display = "block";
}

function closePopup(id){

document
.getElementById(id)
.style.display = "none";

overlay.style.display = "none";
}

document
.getElementById("infoBtn")
.onclick = () => {

openPopup("infoPopup");
};

/* LOCKED */

function openLocked(){

let pass =
prompt("Password:");

if(pass === "2811"){

alert(
"Armaan Ayan's ID: ID-ibq1be5i\n\ntext me anytime"
);
}

else{

alert("Wrong password");
}
}

/* CONTACTS */

function createContactElement(data,type){

let div =
document.createElement("div");

div.className = "contact";

div.innerText =
type === "group"
? "👥 " + data.name
: data.name;

div.onclick = () => {

if(type === "group"){

openGroup(data);
}

else{

openDM(data);
}
};

/* HOLD MENU */

let holdTimer;

div.addEventListener(
"mousedown",
() => {

holdTimer =
setTimeout(() => {

manageItem(data,type);

},700);
}
);

div.addEventListener(
"mouseup",
() => {

clearTimeout(holdTimer);
}
);

div.addEventListener(
"touchstart",
() => {

holdTimer =
setTimeout(() => {

manageItem(data,type);

},700);
}
);

div.addEventListener(
"touchend",
() => {

clearTimeout(holdTimer);
}
);

return div;
}

function renderContacts(){

contactList.innerHTML = "";

contacts.forEach(c => {

contactList.appendChild(

createContactElement(
c,
"contact"
)

);
});

groups.forEach(g => {

contactList.appendChild(

createContactElement(
g,
"group"
)

);
});
}

renderContacts();

/* MANAGE */

function manageItem(data,type){

if(type === "group"){

let action =
prompt(
"Type:\nrename\nremove"
);

if(action === "rename"){

let newName =
prompt("New group name:");

if(!newName) return;

data.name = newName;

localStorage.setItem(
"kyro_groups",
JSON.stringify(groups)
);

renderContacts();

if(currentChat === data.id){

chatTitle.innerText =
newName;
}
}

if(action === "remove"){

groups =
groups.filter(
g => g.id !== data.id
);

localStorage.setItem(
"kyro_groups",
JSON.stringify(groups)
);

renderContacts();

alert("Group removed");
}
}

else{

let action =
prompt(
"Type:\nremove"
);

if(action === "remove"){

contacts =
contacts.filter(
c => c.id !== data.id
);

localStorage.setItem(
"kyro_contacts",
JSON.stringify(contacts)
);

renderContacts();

alert("Contact removed");
}
}
}

/* ADD CONTACT */

function addContact(){

let id =
prompt("Enter Friend ID:");

if(!id) return;

let name =
prompt("Save as:");

if(!name) return;

contacts.push({
id,
name
});

localStorage.setItem(
"kyro_contacts",
JSON.stringify(contacts)
);

renderContacts();
}

/* CREATE GROUP */

function createGroup(){

let name =
prompt("Group name:");

if(!name) return;

let groupID =
"GROUP-" +
Math.random()
.toString(36)
.substring(2,8);

let group = {

id:groupID,
name:name,
members:[myID]
};

groups.push(group);

localStorage.setItem(
"kyro_groups",
JSON.stringify(groups)
);

renderContacts();
}

/* OPEN CHAT */

function openDM(c){

currentChat = c.id;

currentType = "dm";

chat.innerHTML = "";

chatTitle.innerText =
c.name;

sidebar.classList.remove("open");

overlay.style.display = "none";

listenDM();
}

function openGroup(g){

currentChat = g.id;

currentType = "group";

chat.innerHTML = "";

chatTitle.innerText =
g.name;

sidebar.classList.remove("open");

overlay.style.display = "none";

listenGroup();
}

/* MESSAGE */

function addMessage(
type,
sender,
text,
reply=null
){

let div =
document.createElement("div");

div.className =
"msg " + type;

let replyHTML = "";

if(reply){

replyHTML = `
<div class="replyBox">
${reply.sender}: ${reply.text}
</div>
`;
}

div.innerHTML = `

<div class="sender">
${sender}
</div>

${replyHTML}

<div>
${text}
</div>
`;

let startX = 0;

div.addEventListener(
"touchstart",
e => {

startX =
e.touches[0].clientX;
}
);

div.addEventListener(
"touchend",
e => {

let endX =
e.changedTouches[0].clientX;

if(endX - startX > 70){

replyData = {

sender,
text
};

document
.getElementById(
"replyPreview"
)
.style.display = "block";

document
.getElementById(
"replyTop"
)
.innerText =
"Replying to " +
sender;

document
.getElementById(
"replyText"
)
.innerText = text;
}
}
);

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;
}

/* SEND */

function sendMsg(){

if(!currentChat) return;

let text =
messageInput.value.trim();

if(!text) return;

let data = {

sender:username,

senderID:myID,

text:text,

reply:replyData,

time:Date.now()
};

if(currentType === "dm"){

db.ref(
"messages/" +
currentChat
).push(data);
}

else{

db.ref(
"groups/" +
currentChat
).push(data);
}

addMessage(
"me",
"You",
text,
replyData
);

messageInput.value = "";

replyData = null;

document
.getElementById(
"replyPreview"
)
.style.display = "none";
}

document
.getElementById("sendBtn")
.onclick = sendMsg;

messageInput
.addEventListener(
"keypress",
e => {

if(e.key === "Enter"){

sendMsg();
}
}
);

/* LISTEN */

function listenDM(){

db.ref(
"messages/" +
myID
)
.off();

db.ref(
"messages/" +
myID
)
.on(
"child_added",
snapshot => {

let data =
snapshot.val();

if(
data.senderID ===
currentChat
){

addMessage(
"other",
data.sender,
data.text,
data.reply
);
}
});
}

function listenGroup(){

db.ref(
"groups/" +
currentChat
)
.off();

db.ref(
"groups/" +
currentChat
)
.on(
"child_added",
snapshot => {

let data =
snapshot.val();

if(
data.senderID !== myID
){

addMessage(
"other",
data.sender,
data.text,
data.reply
);
}
});
}

</script>

</body>
</html>
