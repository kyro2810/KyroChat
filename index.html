<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KyroChat V4</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0b141a;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    background:#202c33;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #2f3b43;
    z-index:10;
}

#leftHeader{
    display:flex;
    align-items:center;
    gap:12px;
}

#menuBtn,
#settingsBtn{
    background:none;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
}

#title{
    font-size:20px;
    font-weight:bold;
}

/* TOP INFO */

#chatName{
    background:#111b21;
    padding:12px;
    border-bottom:1px solid #2f3b43;
    line-height:1.6;
}

#myIDText{
    color:#00a884;
    font-size:13px;
}

/* CHAT */

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.msg{
    max-width:75%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    word-wrap:break-word;
    position:relative;
}

.me{
    background:#005c4b;
    align-self:flex-end;
}

.other{
    background:#202c33;
    align-self:flex-start;
}

.sender{
    font-size:11px;
    opacity:0.7;
    margin-bottom:5px;
}

.deleteBtn{
    margin-top:8px;
    font-size:11px;
    opacity:0.7;
    cursor:pointer;
}

/* INPUT */

#bottom{
    display:flex;
    gap:5px;
    padding:10px;
    background:#202c33;
}

#message{
    flex:1;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#2a3942;
    color:white;
}

#sendBtn{
    border:none;
    background:#00a884;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

/* SIDEBAR */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    z-index:998;
}

#sidebar{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100%;
    background:#111b21;
    transition:0.25s;
    z-index:999;
    overflow-y:auto;
    border-right:1px solid #2f3b43;
}

#sidebar.open{
    left:0;
}

#sidebarHeader{
    padding:15px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #2f3b43;
}

.sideButton{
    width:100%;
    padding:12px;
    border:none;
    background:#202c33;
    color:white;
    text-align:left;
    cursor:pointer;
    border-bottom:1px solid #2f3b43;
}

.contact{
    padding:12px;
    border-bottom:1px solid #2f3b43;
    cursor:pointer;
    position:relative;
}

.contact:hover{
    background:#202c33;
}

.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:14px;
    right:14px;
}

/* SETTINGS */

#settingsMenu{
    position:fixed;
    top:60px;
    right:10px;
    background:#202c33;
    border-radius:10px;
    overflow:hidden;
    display:none;
    z-index:1001;
    border:1px solid #2f3b43;
}

.settingItem{
    padding:12px 18px;
    cursor:pointer;
    border-bottom:1px solid #2f3b43;
}

.settingItem:hover{
    background:#2a3942;
}

</style>
</head>

<body>

<!-- OVERLAY -->

<div id="overlay"></div>

<!-- SIDEBAR -->

<div id="sidebar">

    <div id="sidebarHeader">
        Chats
    </div>

    <button
        class="sideButton"
        onclick="addContact()"
    >
        + Add Contact
    </button>

    <button
        class="sideButton"
        onclick="createGroup()"
    >
        + Create Group
    </button>

    <div id="contactList"></div>

</div>

<!-- SETTINGS -->

<div id="settingsMenu">

    <div
        class="settingItem"
        onclick="changeName()"
    >
        Change Username
    </div>

    <div
        class="settingItem"
        onclick="showMyID()"
    >
        Show My ID
    </div>

    <div
        class="settingItem"
        onclick="copyMyID()"
    >
        Copy My ID
    </div>

    <div
        class="settingItem"
        onclick="clearLocalChats()"
    >
        Clear Local Chats
    </div>

</div>

<!-- HEADER -->

<header>

    <div id="leftHeader">

        <button id="menuBtn">
            ☰
        </button>

        <div id="title">
            KyroChat
        </div>

    </div>

    <button id="settingsBtn">
        ⚙
    </button>

</header>

<!-- INFO -->

<div id="chatName">

    Open ☰ and select a contact

    <br><br>

    <span style="
    font-size:12px;
    opacity:0.7;
    ">
        Your ID:
    </span>

    <br>

    <span id="myIDText"></span>

</div>

<!-- CHAT -->

<div id="chat"></div>

<!-- INPUT -->

<div id="bottom">

    <input
        id="message"
        placeholder="Type message..."
    >

    <button
        id="sendBtn"
        onclick="sendMsg()"
    >
        SEND
    </button>

</div>

<script>

// =======================
// FIREBASE
// =======================

const firebaseConfig = {

  apiKey: "AIzaSyDBzZ97kqHW9gcCW_ObNvpCNlW1VTGiDxs",

  authDomain: "kyrochat.firebaseapp.com",

  databaseURL: "https://kyrochat-default-rtdb.asia-southeast1.firebasedatabase.app/",

  projectId: "kyrochat",

  storageBucket: "kyrochat.firebasestorage.app",

  messagingSenderId: "360761453559",

  appId: "1:360761453559:web:2138c9c2e83512ace85cf2",

  measurementId: "G-R2G6R4NM8Q"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// =======================
// USER
// =======================

let myID =
localStorage.getItem("kyro_id");

if(!myID){

    myID =
    "ID-" +
    Math.random()
    .toString(36)
    .substring(2,10);

    localStorage.setItem(
        "kyro_id",
        myID
    );
}

let username =
localStorage.getItem("kyro_name");

if(!username){

    username =
    prompt("Enter username:");

    localStorage.setItem(
        "kyro_name",
        username
    );
}

document
.getElementById("myIDText")
.innerText = myID;


// =======================
// STORAGE
// =======================

let contacts =
JSON.parse(
    localStorage.getItem(
        "kyro_contacts"
    )
) || [];

let unread =
JSON.parse(
    localStorage.getItem(
        "kyro_unread"
    )
) || {};

let localChats =
JSON.parse(
    localStorage.getItem(
        "kyro_localChats"
    )
) || {};

let activeChat = null;


// =======================
// ELEMENTS
// =======================

const chat =
document.getElementById("chat");

const contactList =
document.getElementById("contactList");


// =======================
// SAVE
// =======================

function saveAll(){

    localStorage.setItem(
        "kyro_contacts",
        JSON.stringify(contacts)
    );

    localStorage.setItem(
        "kyro_unread",
        JSON.stringify(unread)
    );

    localStorage.setItem(
        "kyro_localChats",
        JSON.stringify(localChats)
    );
}


// =======================
// SIDEBAR
// =======================

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");

document
.getElementById("menuBtn")
.onclick = () => {

    sidebar.classList.add("open");

    overlay.style.display =
    "block";
};

overlay.onclick = () => {

    sidebar.classList.remove(
        "open"
    );

    overlay.style.display =
    "none";
};


// =======================
// SETTINGS
// =======================

document
.getElementById("settingsBtn")
.onclick = () => {

    const menu =
    document.getElementById(
        "settingsMenu"
    );

    if(
        menu.style.display ===
        "block"
    ){

        menu.style.display =
        "none";
    }

    else{

        menu.style.display =
        "block";
    }
};


// =======================
// RENDER CONTACTS
// =======================

function renderContacts(){

    contactList.innerHTML = "";

    contacts.forEach(contact => {

        const div =
        document.createElement("div");

        div.className =
        "contact";

        div.innerText =
        contact.name;


        // unread
        if(unread[contact.id]){

            const dot =
            document.createElement("div");

            dot.className =
            "dot";

            div.appendChild(dot);
        }


        // open chat
        div.onclick = () => {

            activeChat =
            contact.id;

            unread[contact.id] =
            false;

            saveAll();

            renderContacts();

            openChat(
                contact.id,
                contact.name
            );

            sidebar.classList.remove(
                "open"
            );

            overlay.style.display =
            "none";
        };


        // rename
        div.oncontextmenu = (e) => {

            e.preventDefault();

            let newName =
            prompt(
                "Rename contact:",
                contact.name
            );

            if(newName){

                contact.name =
                newName;

                saveAll();

                renderContacts();
            }
        };

        contactList.appendChild(div);
    });
}

renderContacts();


// =======================
// OPEN CHAT
// =======================

function openChat(id,name){

    chat.innerHTML = "";

    document
    .getElementById("chatName")
    .innerHTML =
    `
    ${name}

    <br><br>

    <span style="
    font-size:12px;
    opacity:0.7;
    ">
        Your ID:
    </span>

    <br>

    <span id="myIDText">
        ${myID}
    </span>
    `;

    if(!localChats[id]){

        localChats[id] = [];
    }

    localChats[id].forEach(msg => {

        addMessage(
            msg.type,
            msg.sender,
            msg.text,
            false,
            msg.id
        );
    });
}


// =======================
// ADD MESSAGE UI
// =======================

function addMessage(
    type,
    sender,
    text,
    save=true,
    messageID=null
){

    const div =
    document.createElement("div");

    div.className =
    "msg " + type;

    div.dataset.id =
    messageID || "";

    div.innerHTML =
    `
    <div class="sender">
        ${sender}
    </div>

    <div class="msgText">
        ${text}
    </div>
    `;


    // delete button
    if(type === "me"){

        const del =
        document.createElement("div");

        del.className =
        "deleteBtn";

        del.innerText =
        "Delete for everyone";

        del.onclick = () => {

            deleteMessageForEveryone(
                div.dataset.id,
                div
            );
        };

        div.appendChild(del);
    }

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;


    if(save && activeChat){

        if(!localChats[activeChat]){

            localChats[activeChat] =
            [];
        }

        localChats[activeChat]
        .push({

            id:messageID,

            type:type,

            sender:sender,

            text:text
        });

        localChats[activeChat] =
        localChats[activeChat]
        .slice(-50);

        saveAll();
    }
}


// =======================
// DELETE MESSAGE
// =======================

function deleteMessageForEveryone(
    messageID,
    div
){

    if(!messageID) return;

    db.ref(
        "deleted/" +
        activeChat +
        "/" +
        messageID
    ).set(true);

    div.querySelector(
        ".msgText"
    ).innerText =
    "This message was deleted";
}


// =======================
// ADD CONTACT
// =======================

function addContact(){

    let id =
    prompt(
        "Enter Friend ID:"
    );

    if(!id) return;

    let name =
    prompt(
        "Enter Friend Name:"
    );

    if(!name) return;

    contacts.push({

        id:id,

        name:name
    });

    saveAll();

    renderContacts();
}


// =======================
// GROUPS
// =======================

function createGroup(){

    alert(
        "Group system coming soon 😄"
    );
}


// =======================
// SEND MESSAGE
// =======================

function sendMsg(){

    if(!activeChat){

        alert(
            "Open a contact first."
        );

        return;
    }

    const input =
    document.getElementById(
        "message"
    );

    const text =
    input.value.trim();

    if(!text) return;


    const messageID =
    "msg-" +
    Date.now();


    db.ref(
        "messages/" +
        activeChat
    ).push({

        id:messageID,

        sender: username,

        senderID: myID,

        text: text,

        time: Date.now()
    });


    addMessage(
        "me",
        "You",
        text,
        true,
        messageID
    );

    input.value = "";
}


// =======================
// ENTER TO SEND
// =======================

document
.getElementById("message")
.addEventListener(
    "keypress",
    function(e){

        if(
            e.key === "Enter"
        ){

            sendMsg();
        }
    }
);


// =======================
// RECEIVE MESSAGE
// =======================

db.ref(
    "messages/" + myID
)
.on(
    "child_added",
    snapshot => {

    const data =
    snapshot.val();


    // auto contact
    let exists =
    contacts.find(
        c =>
        c.id === data.senderID
    );

    if(!exists){

        contacts.push({

            id:data.senderID,

            name:data.sender
        });
    }


    unread[data.senderID] =
    true;


    if(
        !localChats[data.senderID]
    ){

        localChats[data.senderID]
        = [];
    }

    localChats[data.senderID]
    .push({

        id:data.id,

        type:"other",

        sender:
        data.sender +
        " (" +
        data.senderID +
        ")",

        text:data.text
    });

    saveAll();


    if(
        activeChat ===
        data.senderID
    ){

        addMessage(

            "other",

            data.sender +
            " (" +
            data.senderID +
            ")",

            data.text,

            false,

            data.id
        );

        unread[data.senderID] =
        false;
    }

    renderContacts();


    // listen for deletes
    db.ref(
        "deleted/" +
        myID +
        "/" +
        data.id
    ).on(
        "value",
        snap => {

        if(snap.exists()){

            document
            .querySelectorAll(".msg")
            .forEach(msg => {

                if(
                    msg.dataset.id ===
                    data.id
                ){

                    const txt =
                    msg.querySelector(
                        ".msgText"
                    );

                    if(txt){

                        txt.innerText =
                        "This message was deleted";
                    }
                }
            });
        }
    });


    snapshot.ref.remove();
});


// =======================
// SETTINGS
// =======================

function changeName(){

    let newName =
    prompt(
        "Enter new username:"
    );

    if(!newName) return;

    username = newName;

    localStorage.setItem(
        "kyro_name",
        username
    );

    alert(
        "Username changed."
    );
}

function showMyID(){

    alert(
        "Your ID:\n\n" +
        myID
    );
}

function copyMyID(){

    navigator.clipboard.writeText(
        myID
    );

    alert(
        "ID copied!"
    );
}

function clearLocalChats(){

    let sure =
    confirm(
        "Clear local chats?"
    );

    if(!sure) return;

    localChats = {};

    saveAll();

    chat.innerHTML = "";

    alert(
        "Chats cleared."
    );
}

</script>

</body>
</html>
