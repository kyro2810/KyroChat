<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KyroChat V2</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0b141a;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#202c33;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #2f3b43;
}

#leftHeader{
    display:flex;
    align-items:center;
    gap:10px;
}

#menuBtn,
#settingsBtn{
    background:none;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
}

#title{
    font-size:20px;
    font-weight:bold;
}

#chatName{
    padding:10px;
    background:#111b21;
    border-bottom:1px solid #2f3b43;
    font-size:14px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.msg{
    max-width:75%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    word-wrap:break-word;
}

.me{
    background:#005c4b;
    align-self:flex-end;
}

.other{
    background:#202c33;
    align-self:flex-start;
}

.sender{
    font-size:11px;
    opacity:0.7;
    margin-bottom:5px;
}

#bottom{
    display:flex;
    gap:5px;
    padding:10px;
    background:#202c33;
}

#message{
    flex:1;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#2a3942;
    color:white;
}

#sendBtn{
    border:none;
    background:#00a884;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

/* Sidebar */

#sidebar{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100%;
    background:#111b21;
    transition:0.25s;
    z-index:1000;
    overflow-y:auto;
    border-right:1px solid #2f3b43;
}

#sidebar.open{
    left:0;
}

#sidebarHeader{
    padding:15px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #2f3b43;
}

.sideButton{
    width:100%;
    padding:12px;
    border:none;
    background:#202c33;
    color:white;
    text-align:left;
    cursor:pointer;
    border-bottom:1px solid #2f3b43;
}

.contact{
    padding:12px;
    border-bottom:1px solid #2f3b43;
    cursor:pointer;
    position:relative;
}

.contact:hover{
    background:#202c33;
}

.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:14px;
    right:14px;
}

#settingsMenu{
    position:fixed;
    top:60px;
    right:10px;
    background:#202c33;
    border-radius:10px;
    overflow:hidden;
    display:none;
    z-index:1001;
    border:1px solid #2f3b43;
}

.settingItem{
    padding:12px 18px;
    cursor:pointer;
    border-bottom:1px solid #2f3b43;
}

.settingItem:hover{
    background:#2a3942;
}

</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">

    <div id="sidebarHeader">
        Chats
    </div>

    <button class="sideButton" onclick="addContact()">
        + Add Contact
    </button>

    <button class="sideButton" onclick="createGroup()">
        + Create Group
    </button>

    <div id="contactList"></div>

</div>

<!-- Settings -->
<div id="settingsMenu">

    <div class="settingItem" onclick="changeName()">
        Change Username
    </div>

    <div class="settingItem" onclick="showMyID()">
        Show My ID
    </div>

    <div class="settingItem" onclick="clearLocalChats()">
        Clear Local Chats
    </div>

</div>

<header>

    <div id="leftHeader">

        <button id="menuBtn">
            ☰
        </button>

        <div id="title">
            KyroChat
        </div>

    </div>

    <button id="settingsBtn">
        ⚙
    </button>

</header>

<div id="chatName">
    No chat selected
</div>

<div id="chat"></div>

<div id="bottom">

    <input
        id="message"
        placeholder="Type message..."
    >

    <button id="sendBtn" onclick="sendMsg()">
        SEND
    </button>

</div>

<script>

// =======================
// Firebase
// =======================

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// =======================
// Permanent ID
// =======================

let myID = localStorage.getItem("kyro_id");

if(!myID){

    myID =
    "ID-" +
    Math.random()
    .toString(36)
    .substring(2,10);

    localStorage.setItem(
        "kyro_id",
        myID
    );
}


// =======================
// Username
// =======================

let username =
localStorage.getItem("kyro_name");

if(!username){

    username = prompt(
        "Enter username:"
    );

    localStorage.setItem(
        "kyro_name",
        username
    );
}


// =======================
// Data
// =======================

let contacts =
JSON.parse(
    localStorage.getItem(
        "kyro_contacts"
    )
) || [];

let unread =
JSON.parse(
    localStorage.getItem(
        "kyro_unread"
    )
) || {};

let localChats =
JSON.parse(
    localStorage.getItem(
        "kyro_localChats"
    )
) || {};

let activeChat = null;


// =======================
// Elements
// =======================

const chat =
document.getElementById("chat");

const contactList =
document.getElementById("contactList");

const chatName =
document.getElementById("chatName");


// =======================
// Save
// =======================

function saveAll(){

    localStorage.setItem(
        "kyro_contacts",
        JSON.stringify(contacts)
    );

    localStorage.setItem(
        "kyro_unread",
        JSON.stringify(unread)
    );

    localStorage.setItem(
        "kyro_localChats",
        JSON.stringify(localChats)
    );
}


// =======================
// Sidebar
// =======================

const sidebar =
document.getElementById("sidebar");

const menuBtn =
document.getElementById("menuBtn");

menuBtn.onclick = () => {

    sidebar.classList.toggle("open");
};


// =======================
// Settings
// =======================

const settingsBtn =
document.getElementById("settingsBtn");

const settingsMenu =
document.getElementById("settingsMenu");

settingsBtn.onclick = () => {

    settingsMenu.style.display =
    settingsMenu.style.display === "block"
    ? "none"
    : "block";
};


// =======================
// Contact Rendering
// =======================

function renderContacts(){

    contactList.innerHTML = "";

    contacts.forEach(contact => {

        const div =
        document.createElement("div");

        div.className = "contact";

        div.innerText = contact.name;


        // unread dot
        if(unread[contact.id]){

            const dot =
            document.createElement("div");

            dot.className = "dot";

            div.appendChild(dot);
        }


        // open chat
        div.onclick = () => {

            activeChat = contact.id;

            unread[contact.id] = false;

            saveAll();

            renderContacts();

            openChat(contact.id, contact.name);

            sidebar.classList.remove("open");
        };


        // rename contact
        div.oncontextmenu = (e) => {

            e.preventDefault();

            let newName = prompt(
                "Rename contact:",
                contact.name
            );

            if(newName){

                contact.name = newName;

                saveAll();

                renderContacts();
            }
        };

        contactList.appendChild(div);
    });
}

renderContacts();


// =======================
// Open Chat
// =======================

function openChat(id, name){

    chat.innerHTML = "";

    chatName.innerText = name;

    if(!localChats[id]){

        localChats[id] = [];
    }

    localChats[id].forEach(msg => {

        addMessage(
            msg.type,
            msg.sender,
            msg.text,
            false
        );
    });
}


// =======================
// Add Message UI
// =======================

function addMessage(type, sender, text, save=true){

    const div =
    document.createElement("div");

    div.className =
    "msg " + type;

    div.innerHTML =
    `
    <div class="sender">
        ${sender}
    </div>

    <div>
        ${text}
    </div>
    `;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;


    if(save && activeChat){

        if(!localChats[activeChat]){

            localChats[activeChat] = [];
        }

        localChats[activeChat].push({

            type:type,
            sender:sender,
            text:text
        });

        // keep only last 50 messages
        localChats[activeChat] =
        localChats[activeChat].slice(-50);

        saveAll();
    }
}


// =======================
// Add Contact
// =======================

function addContact(){

    let id = prompt(
        "Enter Friend ID:"
    );

    if(!id) return;

    let name = prompt(
        "Enter Friend Name:"
    );

    if(!name) return;


    contacts.push({

        id:id,
        name:name
    });

    saveAll();

    renderContacts();
}


// =======================
// Create Group
// =======================

function createGroup(){

    alert(
        "Group system coming soon 😄"
    );
}


// =======================
// Send Message
// =======================

function sendMsg(){

    if(!activeChat){

        alert("Select a chat first.");

        return;
    }

    const input =
    document.getElementById("message");

    const text =
    input.value.trim();

    if(!text) return;


    db.ref(
        "messages/" + activeChat
    ).push({

        sender: username,

        senderID: myID,

        text: text,

        time: Date.now()
    });


    addMessage(
        "me",
        "You",
        text
    );

    input.value = "";
}


// =======================
// ENTER to Send
// =======================

document
.getElementById("message")
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){

            sendMsg();
        }
    }
);


// =======================
// Receive Messages
// =======================

db.ref(
    "messages/" + myID
)
.on(
    "child_added",
    snapshot => {

    const data =
    snapshot.val();


    // auto save contact
    let exists =
    contacts.find(
        c => c.id === data.senderID
    );

    if(!exists){

        contacts.push({

            id:data.senderID,
            name:data.sender
        });
    }


    unread[data.senderID] = true;

    renderContacts();


    // store locally
    if(!localChats[data.senderID]){

        localChats[data.senderID] = [];
    }

    localChats[data.senderID].push({

        type:"other",
        sender:
        data.sender +
        " (" +
        data.senderID +
        ")",
        text:data.text
    });

    saveAll();


    // if current chat open
    if(activeChat === data.senderID){

        addMessage(
            "other",
            data.sender +
            " (" +
            data.senderID +
            ")",
            data.text,
            false
        );

        unread[data.senderID] = false;
    }

    renderContacts();


    // remove relay message
    snapshot.ref.remove();
});


// =======================
// Settings Functions
// =======================

function changeName(){

    let newName = prompt(
        "Enter new username:"
    );

    if(!newName) return;

    username = newName;

    localStorage.setItem(
        "kyro_name",
        username
    );

    alert("Username changed.");
}


function showMyID(){

    alert(
        "Your ID:\n\n" + myID
    );
}


function clearLocalChats(){

    let confirmClear = confirm(
        "Clear local chats?"
    );

    if(!confirmClear) return;

    localChats = {};

    saveAll();

    chat.innerHTML = "";

    alert("Local chats cleared.");
}

</script>
</body>
</html>
```
