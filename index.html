<!-- =========================
KYROCHAT ULTRA DARK UI UPDATE
========================= -->

<style>

html{
scroll-behavior:smooth;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0b141a;
color:white;
height:100dvh;
overflow:hidden;
display:flex;
flex-direction:column;
}

/* =========================
HEADER
========================= */

header{
height:60px;
background:#111b21;
border-bottom:1px solid rgba(255,255,255,0.15);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
box-shadow:
0 0 10px rgba(255,255,255,0.05);
z-index:50;
}

#topTitle{
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

#topTitle:hover{
opacity:0.8;
}

#leftTop{
display:flex;
align-items:center;
gap:12px;
}

#menuBtn,
#settingsBtn,
#infoBtn{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
transition:0.2s;
}

#menuBtn:hover,
#settingsBtn:hover,
#infoBtn:hover{
transform:scale(1.1);
}

/* =========================
CHAT
========================= */

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
min-height:0;
background:
linear-gradient(
180deg,
#0b141a,
#0f1d25
);
}

/* =========================
MESSAGES
========================= */

.msg{
max-width:78%;
padding:10px 12px;
border-radius:18px;
word-wrap:break-word;
animation:msgFade 0.2s ease;
position:relative;
border:1px solid rgba(255,255,255,0.08);
box-shadow:
0 0 8px rgba(255,255,255,0.03);
}

@keyframes msgFade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.me{
align-self:flex-end;
background:#005c4b;
}

.other{
align-self:flex-start;
background:#1f2c34;
}

.sender{
font-size:11px;
opacity:0.7;
margin-bottom:5px;
}

/* =========================
BOTTOM BAR
========================= */

#bottom{
padding:10px;
display:flex;
gap:8px;
background:#111b21;
border-top:1px solid rgba(255,255,255,0.12);
position:sticky;
bottom:0;
}

#message{
flex:1;
background:#1f2c34;
border:1px solid rgba(255,255,255,0.12);
outline:none;
color:white;
padding:12px;
border-radius:15px;
font-size:15px;
}

#message:focus{
border-color:#00a884;
box-shadow:
0 0 10px rgba(0,168,132,0.3);
}

#sendBtn{
background:#00a884;
border:none;
padding:12px 18px;
color:white;
border-radius:14px;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

#sendBtn:hover{
transform:scale(1.05);
}

/* =========================
SIDEBAR
========================= */

#sidebar{
position:fixed;
left:-300px;
top:0;
width:280px;
height:100%;
background:#111b21;
border-right:
1px solid rgba(255,255,255,0.15);
transition:0.25s ease;
z-index:200;
overflow-y:auto;
box-shadow:
0 0 15px rgba(255,255,255,0.04);
}

#sidebar.open{
left:0;
}

#sidebarHeader{
padding:18px;
font-size:20px;
font-weight:bold;
border-bottom:
1px solid rgba(255,255,255,0.1);
}

.sideBtn{
width:100%;
padding:14px;
background:#1a262e;
border:none;
color:white;
text-align:left;
cursor:pointer;
border-bottom:
1px solid rgba(255,255,255,0.08);
transition:0.2s;
}

.sideBtn:hover{
background:#22313b;
}

.contact{
padding:14px;
cursor:pointer;
border-bottom:
1px solid rgba(255,255,255,0.08);
transition:0.2s;
position:relative;
}

.contact:hover{
background:#22313b;
}

.redDot{
width:10px;
height:10px;
background:red;
border-radius:50%;
position:absolute;
right:15px;
top:18px;
box-shadow:
0 0 10px red;
}

/* =========================
OVERLAY
========================= */

#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
display:none;
z-index:150;
backdrop-filter:blur(2px);
}

/* =========================
INFO WINDOW
========================= */

.popup{
position:fixed;
top:50%;
left:50%;
transform:
translate(-50%,-50%)
scale(0.95);

width:90%;
max-width:420px;

background:#111b21;

border:
1px solid rgba(255,255,255,0.15);

border-radius:18px;

padding:20px;

display:none;

z-index:500;

animation:popupAnim 0.18s ease forwards;

box-shadow:
0 0 20px rgba(255,255,255,0.06);
}

@keyframes popupAnim{

from{
opacity:0;
transform:
translate(-50%,-50%)
scale(0.92);
}

to{
opacity:1;
transform:
translate(-50%,-50%)
scale(1);
}

}

.popupTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.closeBtn{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

.popup button{
background:#00a884;
border:none;
padding:10px;
color:white;
border-radius:12px;
width:100%;
margin-top:15px;
cursor:pointer;
}

/* =========================
REPLY BOX
========================= */

#replyPreview{
display:none;
background:#162028;
padding:8px 12px;
border-top:
1px solid rgba(255,255,255,0.1);
font-size:13px;
}

#replyTop{
color:#00a884;
margin-bottom:4px;
}

/* =========================
GROUP SETTINGS
========================= */

.member{
padding:10px;
background:#1b2730;
margin-top:8px;
border-radius:10px;
border:
1px solid rgba(255,255,255,0.08);
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

.msg{
max-width:88%;
}

header{
padding:0 10px;
}

}

</style>

function openSidebar(){

.getElementById("sidebar")
.classList.add("open");

.getElementById("overlay")
.style.display = "block";

.getElementById("sidebar")
.classList.remove("open");
