<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KyroChat</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0b141a;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    background:#202c33;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #2f3b43;
}

#info{
    font-size:12px;
    opacity:0.8;
    margin:8px 0;
}

header button{
    border:none;
    background:#00a884;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

#friends{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:10px;
    background:#111b21;
    border-bottom:1px solid #2f3b43;
}

.friend{
    background:#202c33;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    user-select:none;
}

.friend:hover{
    background:#2a3942;
}

.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:4px;
    right:4px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.msg{
    max-width:75%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    word-wrap:break-word;
}

.me{
    background:#005c4b;
    align-self:flex-end;
}

.other{
    background:#202c33;
    align-self:flex-start;
}

.sender{
    font-size:11px;
    opacity:0.7;
    margin-bottom:5px;
}

#bottom{
    display:flex;
    gap:5px;
    padding:10px;
    background:#202c33;
}

input{
    border:none;
    border-radius:8px;
    padding:10px;
    background:#2a3942;
    color:white;
}

#target{
    width:35%;
}

#message{
    flex:1;
}

button{
    border:none;
    background:#00a884;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>

    <h2>KyroChat</h2>

    <div id="info"></div>

    <button id="changeBtn">
        Change Name
    </button>

</header>

<div id="friends"></div>

<div id="chat"></div>

<div id="bottom">

    <input
        id="target"
        placeholder="Friend ID"
    >

    <input
        id="message"
        placeholder="Type message..."
    >

    <button onclick="sendMsg()">
        SEND
    </button>

</div>

<script>

// =======================
// Firebase
// =======================

const firebaseConfig = {
  apiKey: "AIzaSyDBzZ97kqHW9gcCW_ObNvpCNlW1VTGiDxs",
  authDomain: "kyrochat.firebaseapp.com",
  databaseURL: "https://kyrochat-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "kyrochat",
  storageBucket: "kyrochat.firebasestorage.app",
  messagingSenderId: "360761453559",
  appId: "1:360761453559:web:2138c9c2e83512ace85cf2",
  measurementId: "G-R2G6R4NM8Q"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// =======================
// Permanent ID
// =======================

let myID = localStorage.getItem("kyro_id");

if(!myID){

    myID =
    "ID-" +
    Math.random()
    .toString(36)
    .substring(2,10);

    localStorage.setItem(
        "kyro_id",
        myID
    );
}


// =======================
// Username
// =======================

let username =
localStorage.getItem("kyro_name");

if(!username){

    username = prompt("Enter username:");

    localStorage.setItem(
        "kyro_name",
        username
    );
}


// =======================
// Profile UI
// =======================

function updateProfile(){

    document.getElementById("info")
    .innerHTML =
    `
    ${username}<br>
    ${myID}
    `;
}

updateProfile();


// =======================
// Change Username
// =======================

function changeName(){

    let newName =
    prompt("Enter new username:");

    if(!newName) return;

    username = newName;

    localStorage.setItem(
        "kyro_name",
        username
    );

    updateProfile();
}

document
.getElementById("changeBtn")
.addEventListener(
    "click",
    changeName
);


// =======================
// Elements
// =======================

const chat =
document.getElementById("chat");

const friendsDiv =
document.getElementById("friends");


// =======================
// Friend System
// =======================

let friends =
JSON.parse(
    localStorage.getItem(
        "kyro_friends"
    )
) || [];

let unread =
JSON.parse(
    localStorage.getItem(
        "kyro_unread"
    )
) || {};

function saveFriends(){

    localStorage.setItem(
        "kyro_friends",
        JSON.stringify(friends)
    );
}

function saveUnread(){

    localStorage.setItem(
        "kyro_unread",
        JSON.stringify(unread)
    );
}

function renderFriends(){

    friendsDiv.innerHTML = "";

    friends.forEach(friend => {

        const div =
        document.createElement("div");

        div.className = "friend";

        div.innerText = friend.name;

        // click friend
        div.onclick = () => {

            document
            .getElementById("target")
            .value = friend.id;

            unread[friend.id] = false;

            saveUnread();

            renderFriends();
        };

        // rename friend
        div.oncontextmenu = (e) => {

            e.preventDefault();

            let newName =
            prompt(
                "Rename friend:",
                friend.name
            );

            if(newName){

                friend.name = newName;

                saveFriends();

                renderFriends();
            }
        };

        // unread dot
        if(unread[friend.id]){

            const dot =
            document.createElement("div");

            dot.className = "dot";

            div.appendChild(dot);
        }

        friendsDiv.appendChild(div);
    });
}

renderFriends();


// =======================
// Add Message
// =======================

function addMessage(type, sender, text){

    const div =
    document.createElement("div");

    div.className =
    "msg " + type;

    div.innerHTML =
    `
    <div class="sender">
        ${sender}
    </div>

    <div>
        ${text}
    </div>
    `;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;
}


// =======================
// Send Message
// =======================

function sendMsg(){

    const target =
    document
    .getElementById("target")
    .value
    .trim();

    const text =
    document
    .getElementById("message")
    .value
    .trim();

    if(!target || !text) return;


    // auto save friend
    let exists =
    friends.find(
        f => f.id === target
    );

    if(!exists){

        let friendName =
        prompt(
            "Save this friend as:"
        );

        if(friendName){

            friends.push({

                name: friendName,

                id: target
            });

            saveFriends();

            renderFriends();
        }
    }


    // send message
    db.ref(
        "messages/" + target
    ).push({

        sender: username,

        senderID: myID,

        text: text,

        time: Date.now()
    });


    addMessage(
        "me",
        "You",
        text
    );

    document
    .getElementById("message")
    .value = "";
}


// =======================
// ENTER to Send
// =======================

document
.getElementById("message")
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){

            sendMsg();
        }
    }
);


// =======================
// Receive Messages
// =======================

db.ref(
    "messages/" + myID
)
.on(
    "child_added",
    snapshot => {

    const data =
    snapshot.val();


    // auto save sender
    let exists =
    friends.find(
        f => f.id === data.senderID
    );

    if(!exists){

        friends.push({

            name: data.sender,

            id: data.senderID
        });

        saveFriends();
    }


    // unread dot
    unread[data.senderID] = true;

    saveUnread();

    renderFriends();


    // show message
    addMessage(

        "other",

        data.sender +
        " (" +
        data.senderID +
        ")",

        data.text
    );


    // delete after reading
    snapshot.ref.remove();
});

</script>

</body>
</html>
