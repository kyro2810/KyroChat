<script>

const firebaseConfig = {
  apiKey: "AIzaSyDBzZ97kqHW9gcCW_ObNvpCNlW1VTGiDxs",
  authDomain: "kyrochat.firebaseapp.com",
  databaseURL: "https://kyrochat-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "kyrochat",
  storageBucket: "kyrochat.firebasestorage.app",
  messagingSenderId: "360761453559",
  appId: "1:360761453559:web:2138c9c2e83512ace85cf2",
  measurementId: "G-R2G6R4NM8Q"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// =======================
// Permanent ID
// =======================

let myID = localStorage.getItem("kyro_id");

if(!myID){
    myID = "ID-" + Math.random().toString(36).substring(2,10);
    localStorage.setItem("kyro_id", myID);
}


// =======================
// Username
// =======================

let username = localStorage.getItem("kyro_name");

if(!username){
    username = prompt("Enter username:");
    localStorage.setItem("kyro_name", username);
}


// =======================
// UI
// =======================

document.getElementById("info").innerHTML =
`
${username}<br>
${myID}
`;

const chat = document.getElementById("chat");


// =======================
// Friend System
// =======================

const friendsDiv = document.getElementById("friends");

let friends = JSON.parse(localStorage.getItem("kyro_friends")) || [];

function renderFriends(){

    friendsDiv.innerHTML = "";

    friends.forEach(friend => {

        const div = document.createElement("div");

        div.className = "friend";

        div.innerText = friend.name;

        div.onclick = () => {
            document.getElementById("target").value = friend.id;
        };

        friendsDiv.appendChild(div);
    });
}

renderFriends();


// =======================
// Add Message
// =======================

function addMessage(type, sender, text){

    const div = document.createElement("div");

    div.className = "msg " + type;

    div.innerHTML = `
        <div class="sender">${sender}</div>
        <div>${text}</div>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


// =======================
// Send Message
// =======================

function sendMsg(){

    const target = document.getElementById("target").value.trim();

    const text = document.getElementById("message").value.trim();

    if(!target || !text) return;


    // Save friend automatically
    let exists = friends.find(f => f.id === target);

    if(!exists){

        let friendName = prompt("Save this friend as:");

        if(friendName){

            friends.push({
                name: friendName,
                id: target
            });

            localStorage.setItem(
                "kyro_friends",
                JSON.stringify(friends)
            );

            renderFriends();
        }
    }


    db.ref("messages/" + target).push({
        sender: username,
        senderID: myID,
        text: text,
        time: Date.now()
    });

    addMessage("me", "You", text);

    document.getElementById("message").value = "";
}


// =======================
// Receive Messages
// =======================

db.ref("messages/" + myID).on("child_added", snapshot => {

    const data = snapshot.val();


    // Auto-save sender as friend
    let exists = friends.find(f => f.id === data.senderID);

    if(!exists){

        friends.push({
            name: data.sender,
            id: data.senderID
        });

        localStorage.setItem(
            "kyro_friends",
            JSON.stringify(friends)
        );

        renderFriends();
    }


    addMessage(
        "other",
        data.sender + " (" + data.senderID + ")",
        data.text
    );

    // delete after reading
    snapshot.ref.remove();
});

</script>
